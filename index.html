<!doctype html>
<html lang="en">
<head>

<circle cx="61" cy="14.5" r="1.7" fill="#4fd1ff"></circle>

<circle cx="32" cy="30" r="6.8" fill="#10220f"></circle>
<circle cx="68" cy="30" r="6.8" fill="#10220f"></circle>

<circle cx="31" cy="29" r="9.5" fill="#ffd54a"></circle>
<circle cx="69" cy="29" r="9.5" fill="#ffd54a"></circle>
<circle cx="31" cy="29" r="4" fill="#10220f"></circle>
<circle cx="69" cy="29" r="4" fill="#10220f"></circle>
<rect x="6" y="75" width="88" height="23" rx="6" fill="url(#gg-gold)" stroke="#5c3200" stroke-width="2.5"></rect>
<text x="50" y="93" text-anchor="middle" font-size="19" font-family="'Lilita One', sans-serif" fill="#5c3200">WILD</text>

<path d="M19 33.5 A31 31 0 0 0 81 33.5 Z" fill="#f0364f"></path>

<ellipse cx="34" cy="43" rx="2" ry="3.2"></ellipse>

<ellipse cx="58" cy="55" rx="2" ry="3.2"></ellipse>

<g fill="#ff5fa2" stroke="#8a1c4f" stroke-width="2.5">
<circle cx="50" cy="28" r="15"></circle>
<circle cx="70.9" cy="43.2" r="15"></circle>
<circle cx="62.9" cy="67.8" r="15"></circle>

</defs>
</svg>

<div class="frame" id="frame">
<main class="game" id="game">

<svg class="loose-coin c1" aria-hidden="true"><use href="#gg-coin"></use></svg>
<svg class="loose-coin c2" aria-hidden="true"><use href="#gg-coin"></use></svg>
<svg class="loose-coin c3" aria-hidden="true"><use href="#gg-coin"></use></svg>

<div class="topbar">
<div class="balance">
<svg width="32" height="32" aria-hidden="true"><use href="#gg-coin"></use></svg>
<div class="balance-text">
<div class="label">TOKENS</div>
<div class="balance-value" id="balance">1,000</div>
</div>
</div>
</div>

<h1 class="logo">GATOR GOLD</h1>

<div class="mascot-row">
<div class="mascot" id="mascot">
<svg class="mascot-head" aria-hidden="true"><use href="#gg-happy"></use></svg>
<div class="paw left"></div>
<div class="paw right"></div>
</div>
<div class="bubble"><div class="bubble-tail"></div><div class="bubble-text" id="bubble" role="status">Tap SPIN to play!</div></div>
</div>

<div class="cabinet">
<div class="bulbs"></div>
<div class="reel-window" id="reelWindow">
<div class="reel"><div class="strip"></div></div>
<div class="reel"><div class="strip"></div></div>
<div class="reel"><div class="strip"></div></div>
<div class="payline" id="payline"></div>
</div>
<div class="bulbs"></div>
</div>

<div class="win-panel" id="winPanel">
<div class="win-text">
<div class="win-title" id="winTitle">GOOD LUCK</div>
<div class="win-detail" id="winDetail">Match 3 on the gold line</div>
</div>
<div class="win-amount-wrap" id="winAmountWrap" hidden>
<svg width="30" height="30" aria-hidden="true"><use href="#gg-coin"></use></svg>
<div class="win-amount" id="winAmount">+0</div>
</div>
</div>

<div class="controls">
<div class="wager-card">
<div class="label">WAGER</div>
<div class="wager-value" id="wager">25</div>
<div class="wager-buttons">
<button class="step" id="wagerDown" aria-label="Lower wager">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12"></path></svg>
</button>
<button class="step" id="wagerUp" aria-label="Raise wager">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12M12 6v12"></path></svg>
</button>
</div>
</div>
<button class="spin" id="spin">SPIN</button>
<button class="side-card" id="paysOpen">
<svg width="52" height="52" aria-hidden="true"><use href="#gg-chest"></use></svg>
<div class="side-label">PAYS</div>
</button>
</div>

<div class="bigwin" id="bigwin" hidden>
<div class="bigwin-coins" id="bigwinCoins"></div>
<div class="bigwin-title">BIG WIN!</div>
<div class="bigwin-amount" id="bigwinAmount">+0</div>
</div>

<dialog class="pays" id="pays" aria-labelledby="paysTitle">
<h2 id="paysTitle">WHAT PAYS</h2>
<p class="pays-note">On the gold line, at a wager of <span id="paysWager">25</span></p>
<div class="pays-list" id="paysList"></div>
<p class="pays-note">Wild Gator stands in for any symbol.</p>
<form method="dialog"><button class="pays-close">GOT IT</button></form>
</dialog>

</main>
</div>

<script type="module" src="src/ui/main.js"></script>
</body>
</html>
